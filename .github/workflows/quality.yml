name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    name: quality (${{ matrix.python-version }})
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Import Qt smoke test
        run: python -c "import PySide6.QtWidgets; print('PySide6', PySide6.__version__)"

      - name: Check documentation synchronization
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$DOC_SYNC_BASE" ] || [ "$DOC_SYNC_BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check_docs_sync.py --working-tree
          else
            python scripts/check_docs_sync.py --base "$DOC_SYNC_BASE"
          fi

      - name: Check commit messages
        env:
          DOC_SYNC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$DOC_SYNC_BASE" ] || [ "$DOC_SYNC_BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check_commit_message.py
          else
            python scripts/check_commit_message.py --base "$DOC_SYNC_BASE"
          fi

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest --junitxml=pytest.xml

      - name: Report failing tests
        if: failure()
        run: |
          if [ -f pytest.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest.xml").getroot()
          failures = []
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              name = "::".join(filter(None, (case.get("classname"), case.get("name"))))
              lines = (problem.get("message") or "").strip().splitlines()
              detail = lines[0][:160] if lines else (problem.get("type") or "")
              failures.append(f"{name} - {detail}")
          for line in failures[:10]:
              print(f"::error::{line}")
          print(f"::warning::共 {len(failures)} 个失败或错误用例")
          PY
          else
            echo "::error::pytest 未生成 JUnit 报告，可能在启动阶段退出"
          fi
